name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /Users/runner/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid make

      - name: Clone Theos
        run: git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Install patched SDKs
        run: |
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build libarchive for iOS
        run: |
          curl -LO https://github.com/libarchive/libarchive/releases/download/v3.8.7/libarchive-3.8.7.tar.gz
          tar xzf libarchive-3.8.7.tar.gz
          cd libarchive-3.8.7
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export CC="xcrun -sdk iphoneos clang -arch arm64"
          export CFLAGS="-isysroot $SDKROOT -mios-version-min=13.0"
          ./configure --host=arm64-apple-darwin --disable-shared \
            --without-lzma --without-bz2lib --without-iconv \
            --without-lzo2 --without-nettle --without-xml2 --without-expat
          make -j$(sysctl -n hw.ncpu)
          make install DESTDIR=/tmp/libarchive-ios
          mkdir -p $THEOS/lib/iphone
          cp /tmp/libarchive-ios/usr/local/lib/libarchive.a $THEOS/lib/iphone/
          cp -r /tmp/libarchive-ios/usr/local/include/* $THEOS/include/

      - name: Build IPA
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TaskPortHaxxApp.ipa
          path: packages/*.ipa
